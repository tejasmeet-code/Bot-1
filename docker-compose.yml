version: "3.8"

services:
  relosta-bot:
    build: .
    container_name: relosta-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - relosta-bot-data:/app/.data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  relosta-bot-data:
    driver: local
